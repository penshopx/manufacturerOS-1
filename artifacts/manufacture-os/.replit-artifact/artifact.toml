kind = "web"
previewPath = "/"
title = "ManufactureOS"
description = "A dark, operational AI dashboard for Indonesian Tier 2 automotive manufacturers, with production, quality, safety, maintenance, and specialist agent workflows."
version = "1.0.0"
id = "artifacts/manufacture-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22547

[services.development]
run = "pnpm --filter @workspace/manufacture-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/manufacture-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/manufacture-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22547"
BASE_PATH = "/"
