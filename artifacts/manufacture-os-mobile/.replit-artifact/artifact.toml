kind = "mobile"
previewPath = "/manufacture-os-mobile/"
title = "ManufactureOS Mobile"
description = "A native mobile companion for ManufactureOS that helps Indonesian manufacturing teams scan daily production health, agent alerts, quality, and safety from anywhere."
version = "1.0.0"
id = "artifacts/manufacture-os-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/manufacture-os-mobile/" ]
localPort = 20014

[services.development]
run = "pnpm --filter @workspace/manufacture-os-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/manufacture-os-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/manufacture-os-mobile", "run", "serve" ]

[services.env]
PORT = "20014"
BASE_PATH = "/manufacture-os-mobile/"
